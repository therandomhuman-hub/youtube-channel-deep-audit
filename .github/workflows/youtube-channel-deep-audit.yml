name: YouTube Channel Deep Audit
on:
  workflow_dispatch:
    inputs:
      channel_url:
        description: "Public YouTube channel URL (/channel/UC... or resolved URL)"
        required: true
        type: string
      run_id:
        description: "Optional audit run identifier"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install -r requirements.txt
      - name: Run audit
        run: python youtube_audit.py --channel-url "${{ inputs.channel_url }}" --out audit
      - name: Validate no secret leakage
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'AIza[0-9A-Za-z_-]{20,}|YOUTUBE_API_KEY=.*[A-Za-z0-9_-]{20,}' audit .github --exclude='*.yml' ; then
            echo "Potential credential leakage detected"
            exit 1
          fi
      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: youtube-audit-${{ github.run_id }}
          path: audit/
          retention-days: 14
