name: Runtime CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q runtime youtube_audit.py tests
      - run: python -m unittest discover -s tests -v

  production-audit-request:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Check for active audit request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .audit/request.json ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python -c 'import json; from pathlib import Path; p=json.loads(Path(".audit/request.json").read_text(encoding="utf-8")); print("CHANNEL URL:", p["channel_url"]) if p.get("status") != "consumed" else (_ for _ in ()).throw(SystemExit(3))' > /tmp/request_body.txt
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.request.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime
        if: steps.request.outputs.run == 'true'
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Resolve target
        if: steps.request.outputs.run == 'true'
        run: |
          mkdir -p audit
          python runtime/request.py --issue-body "$(cat /tmp/request_body.txt)" > audit/channel_url.txt

      - name: Verify API secret without printing it
        if: steps.request.outputs.run == 'true'
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_API_KEY"
          echo "credential_present=true" > audit/credential_status.txt

      - name: Run full-channel audit
        if: steps.request.outputs.run == 'true'
        shell: bash
        run: |
          set +e
          python youtube_audit.py --skill skill.md --channel "$(cat audit/channel_url.txt)" --output audit > audit/collector.log 2>&1
          code=$?
          echo "$code" > audit/collector_exit_code.txt
          cat audit/collector.log
          exit 0

      - name: Validate release
        if: steps.request.outputs.run == 'true'
        shell: bash
        run: |
          set +e
          python runtime/validate.py audit > audit/validation.json 2>&1
          code=$?
          echo "$code" > audit/validator_exit_code.txt
          cat audit/validation.json
          exit 0

      - name: Release gate
        if: steps.request.outputs.run == 'true'
        run: |
          set -euo pipefail
          c=$(cat audit/collector_exit_code.txt)
          v=$(cat audit/validator_exit_code.txt)
          [[ "$c" == "0" && "$v" == "0" ]]
          echo "RELEASED=true" > audit/release_status.txt

      - name: Upload audit artifacts
        if: always() && steps.request.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: youtube-channel-deep-audit-${{ github.run_id }}
          path: audit/
          retention-days: 30
