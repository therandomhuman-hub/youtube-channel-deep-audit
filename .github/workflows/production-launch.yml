name: Production Audit Launch

on:
  push:
    paths:
      - ".audit/request.json"

permissions:
  contents: read
  actions: read

jobs:
  production-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: No-op when request is absent or consumed
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .audit/request.json ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
import json, os
from pathlib import Path
p=json.loads(Path(".audit/request.json").read_text(encoding="utf-8"))
if p.get("status") == "consumed":
    raise SystemExit(3)
print("request_id=",p.get("request_id",""))
print("channel_url=",p.get("channel_url",""))
PY
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Resolve target
        if: steps.request.outputs.run == 'true'
        run: |
          mkdir -p audit
          python - <<'PY' > audit/request_body.txt
import json
from pathlib import Path
p=json.loads(Path(".audit/request.json").read_text(encoding="utf-8"))
print("CHANNEL URL:",p["channel_url"])
PY
          python runtime/request.py --issue-body "$(cat audit/request_body.txt)" > audit/channel_url.txt

      - name: Verify credential presence
        if: steps.request.outputs.run == 'true'
        run: |
          test -n "$YOUTUBE_API_KEY"
          echo "credential_present=true" > audit/credential_status.txt

      - name: Run full production audit
        if: steps.request.outputs.run == 'true'
        run: |
          set +e
          python youtube_audit.py --skill skill.md --channel "$(cat audit/channel_url.txt)" --output audit > audit/collector.log 2>&1
          code=$?
          echo "$code" > audit/collector_exit_code.txt
          cat audit/collector.log
          exit 0

      - name: Validate package
        if: steps.request.outputs.run == 'true'
        run: |
          set +e
          python runtime/validate.py audit > audit/validation.json 2>&1
          code=$?
          echo "$code" > audit/validator_exit_code.txt
          cat audit/validation.json
          exit 0

      - name: Final release gate
        if: steps.request.outputs.run == 'true'
        run: |
          set -euo pipefail
          c=$(cat audit/collector_exit_code.txt)
          v=$(cat audit/validator_exit_code.txt)
          [[ "$c" == "0" && "$v" == "0" ]]
          echo "RELEASED=true" > audit/release_status.txt

      - name: Upload audit package
        if: always() && steps.request.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: youtube-channel-deep-audit-${{ github.run_id }}
          path: audit/
          retention-days: 30
