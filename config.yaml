version: 12.0-production
mode: DEEP
public_only: true
exhaustive_upload_inventory: true
exhaustive_public_comments: true
browser_public_surfaces: true
transcript_policy: full_evidence_bounded_audit
credential_source: github_actions_secret:YOUTUBE_API_KEY
api_key_never_in_chat: true
api_key_never_in_artifacts: true
general_quota_run_budget: 9000
transcript_full_text_persisted: false
transcript_languages: en,en-US,en-GB,en-IN
